# 목표 지표 정의. 라벨과 모델 입력은 모두 src/targets 의 같은 함수로 만든다.

# Timestral 이 출력하는 21개 분위수 레벨 (0.01, 0.05, 0.10, ..., 0.95, 0.99)
quantile_levels: [0.01, 0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50,
                  0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 0.99]

# 시계열 정의 (각 날짜 t 기준 직전 window 거래일의 trailing 값)
series:
  m5:
    kind: mdd              # 윈도우 내 고점 대비 최대낙폭 (음수, 예: -0.12)
    window: 5
    transform: log1p_mag   # 모델 입력은 낙폭 크기 m=-mdd 에 log1p
  m20:
    kind: mdd
    window: 20
    transform: log1p_mag
  yz20:
    kind: yang_zhang       # Yang-Zhang 변동성, 연율화
    window: 20
    annualize: 252
    transform: log

# 실험 = (시계열, 예측 스텝). "t 이후 h일의 지표" == "t+h 시점의 trailing 값"
experiments:
  - {series: m5,   horizon: 5}
  - {series: m20,  horizon: 20}
  - {series: yz20, horizon: 20}
  - {series: yz20, horizon: 5}    # 보조

# 밴드 해석에 쓰는 레벨 (docs 2절)
bands:
  m5:   {panic: 0.05, common: 0.10, mid: 0.50}
  m20:  {worst: 0.05, low: 0.10, mid: 0.50}
  yz20: {low: 0.10, high: 0.90}
